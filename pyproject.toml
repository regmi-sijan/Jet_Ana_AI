[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-ana-ai"
version = "0.1.0"
description = "Contextual EMCal cluster embeddings and exploratory variable-count jet grouping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
root = ["uproot>=5", "awkward>=2"]
parquet = ["pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
jet-ai = "jet_ana_ai.cli:main"

[tool.setuptools.packages.find]
include = ["jet_ana_ai*"]
